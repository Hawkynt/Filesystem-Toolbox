name: CI

# Event-driven (no cron). release.yml and nightly.yml reuse this.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call: {}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # The app is a Windows WinExe (net48 + net8.0-windows), so the full build runs on windows.
  # The 9.0.x SDK understands the .slnx solution format; the 8.0.x runtime executes the tests.
  build:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # version.pl counts commits per project
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Stamp per-package versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp
      - run: dotnet build Filesystem-Toolbox.slnx --configuration Release

      # required tier: everything except wall-clock-sensitive performance tests
      - name: Test with coverage (required)
        run: dotnet test Filesystem-Toolbox.Tests/Filesystem-Toolbox.Tests.csproj -c Release --no-build --filter "TestCategory!=Performance" --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults --logger "console;verbosity=normal"

      # advisory tier: timing assertions are flaky on shared runners and never block a merge
      - name: Test performance (advisory)
        continue-on-error: true
        run: dotnet test Filesystem-Toolbox.Tests/Filesystem-Toolbox.Tests.csproj -c Release --no-build --filter "TestCategory=Performance" --logger "console;verbosity=normal"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # The Core library is OS-neutral; its pure-compute Unit tier also runs on Linux to keep
  # path/IO assumptions honest. Integration/EndToEnd stay Windows-only (NTFS, attributes, links).
  test-core:
    name: test core units (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Filesystem-Toolbox.Tests/Filesystem-Toolbox.Tests.csproj -c Release -f net8.0 --filter "TestCategory=Unit" --logger "console;verbosity=normal"

  # A text lint over README.md against the house convention — no build, no toolchain — so it
  # runs beside the rest rather than inside it and cannot mask them.
  repo-readme:
    name: repo README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Hawkynt/RepositoryTemplate/repo-readme@v1
